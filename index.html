<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enzyme workshop</title>
    <meta name="description" content="A sandbox for chaining cartoon enzymes together." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffc65c'/%3E%3Ccircle cx='12' cy='13' r='6' fill='%23ff6b6b'/%3E%3Ccircle cx='20' cy='18' r='6' fill='%2386d4ff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body class="home-mode">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
      </div>
      <!-- The bench and the workstation deliberately have no tab any more. Their
           screens still exist and still render unchanged; they are reached from
           inside the make-a-molecule flow, which is what asks for them. -->
      <nav class="tabs" id="tabs" aria-label="Screens">
        <button class="tab" data-screen="home" aria-current="page">Make a molecule</button>
        <button class="tab" data-screen="collection">Collection</button>
        <button class="tab" data-screen="splice">Splice table</button>
      </nav>
      <button class="limits-button" id="limits-button" aria-haspopup="dialog">
        <span aria-hidden="true">?</span> What this can't tell you
      </button>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <dialog id="limits-dialog" class="limits-dialog" aria-labelledby="limits-title"></dialog>
    <dialog id="reaction-dialog" class="limits-dialog reaction-dialog" aria-label="Stylised reaction cartoon"></dialog>

    <script type="module" src="src/ui/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enzyme workshop</title>
    <meta name="description" content="A sandbox for chaining cartoon enzymes together." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
      </div>
      <nav class="tabs" id="tabs" aria-label="Screens">
        <button class="tab" data-screen="home" aria-current="page">Vacuum</button>
        <button class="tab" data-screen="collection">Collection</button>
        <button class="tab" data-screen="workstation">Workstation</button>
        <button class="tab" data-screen="bench">The bench</button>
        <button class="tab" data-screen="splice">Splice table</button>
      </nav>
      <button class="limits-button" id="limits-button" aria-haspopup="dialog">
        <span aria-hidden="true">?</span> What this can't tell you
      </button>
    </header>

    <main id="screen" class="screen" aria-live="polite"></main>

    <dialog id="limits-dialog" class="limits-dialog" aria-labelledby="limits-title"></dialog>
    <dialog id="reaction-dialog" class="limits-dialog reaction-dialog" aria-label="Stylised reaction cartoon"></dialog>

    <script type="module" src="src/ui/app.js"></script>
  </body>
</html>
